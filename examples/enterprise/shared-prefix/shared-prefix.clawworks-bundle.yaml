schema: clawworks.workflow-bundle
schemaVersion: 1
trees:
  - schema: clawworks.workflow-tree
    schemaVersion: 1
    id: demo.shared-prefix
    version: 1.3.0
    name: Shared-prefix returns verification
    description:
      Fictional order return assessments. Three executable shared steps create a case, collect
      order/risk data, and record eligibility evidence. Then two independent tails each prepare and finalize
      either a refund assessment or an exchange assessment. Explicitly comparing both completed assessments
      selects both tails, sharing the first three steps once. No real money or goods move.
    capabilityGrants: explicit
    root:
      id: case
      title: Open assessment case
      description:
        Start a fictional returns assessment; require an order id and a case id. Every selected
        route executes this step once.
      ontology:
        audit: true
        deniedTools: &a1
          - exec
          - process
          - browser
          - web_fetch
          - web_search
          - read
          - write
          - edit
          - apply_patch
          - message
        allowedTools: &a11
          - knowledge_search
          - search_objects
          - get_neighbors
          - compute_function
          - invoke_action
        entities:
          - &a2
            id: case
            properties:
              - id: case-id
                type: id
                primaryKey: true
                required: true
              - id: order-id
                type: string
                required: true
        actions:
          - id: open-case
            tools:
              - invoke_action
            parameters:
              - id: case-id
                type: id
                required: true
              - id: order-id
                type: string
                required: true
            effects:
              - entity: case
                kind: create
        knowledgeFoundations:
          - proof.intake
          - proof.privacy
        skills:
          - proof-evidence
        guidance:
          Search proof.intake and proof.privacy together in ONE knowledge_search call using both
          foundation ids. Read the exact case-id with search_objects; reject substring matches for
          another id. If absent call open-case using the supplied case-id and order-id. If present
          verify its order-id matches; stop on a mismatch. Complete after creating or verifying the
          case. Throughout this run, carry verified tool outputs forward between steps. Reuse earlier successful knowledge snippets only within this run and only for
          foundations explicitly allowed by the current node. Search only missing or
          insufficient evidence, combining the needed foundations into one call, and use get_neighbors without relationship and
          limit=50 to read all in-scope edges and neighbor properties together. Never repeat a
          successful read unless data changed or this step explicitly requires a fresh check. Never
          send money, goods, or messages.
        expectedOutput: Created or verified local case and both intake/privacy citations.
      children:
        - id: case.order
          title: Collect order and risk facts
          description:
            Read order and risk MCP services, then persist the customer/order/item/risk graph. Unknown orders
            stop here without completing this step.
          ontology:
            audit: true
            deniedTools: *a1
            allowedTools:
              - knowledge_search
              - search_objects
              - get_neighbors
              - compute_function
              - invoke_action
              - proof-orders__*
              - proof-risk__*
            entities:
              - *a2
              - &a3
                id: customer
                properties:
                  - id: customer-id
                    type: id
                    primaryKey: true
                    required: true
                  - id: customer-name
                    type: string
                    required: true
              - &a4
                id: order
                properties:
                  - id: order-id
                    type: id
                    primaryKey: true
                    required: true
                  - id: total
                    type: number
                    required: true
                  - id: days
                    type: number
                    required: true
              - &a5
                id: item
                properties:
                  - id: item-id
                    type: id
                    primaryKey: true
                    required: true
                  - id: sku
                    type: string
                    required: true
                  - id: quantity
                    type: number
                    required: true
              - &a6
                id: risk-signal
                properties:
                  - id: signal-id
                    type: id
                    primaryKey: true
                    required: true
                  - id: risk
                    type: number
                    required: true
            relationships:
              - &a7
                id: case-order
                from: case
                to: order
                cardinality: many-to-one
              - &a8
                id: customer-order
                from: customer
                to: order
                cardinality: many-to-one
              - &a9
                id: order-item
                from: order
                to: item
                cardinality: many-to-one
              - &a10
                id: order-signal
                from: order
                to: risk-signal
                cardinality: many-to-one
            mcpServers:
              - proof-orders
              - proof-risk
            knowledgeFoundations:
              - proof.evidence
              - proof.privacy
            skills:
              - proof-evidence
            actions:
              - id: record-order
                tools:
                  - invoke_action
                parameters:
                  - id: case-id
                    type: id
                    required: true
                  - id: order-id
                    type: id
                    required: true
                  - id: customer-id
                    type: id
                    required: true
                  - id: customer-name
                    type: string
                    required: true
                  - id: total
                    type: number
                    required: true
                  - id: days
                    type: number
                    required: true
                  - id: item-id
                    type: id
                    required: true
                  - id: sku
                    type: string
                    required: true
                  - id: quantity
                    type: number
                    required: true
                  - id: signal-id
                    type: id
                    required: true
                  - id: risk
                    type: number
                    required: true
                effects:
                  - entity: customer
                    kind: create
                  - entity: order
                    kind: create
                  - entity: item
                    kind: create
                  - entity: risk-signal
                    kind: create
                  - relationship: case-order
                    kind: link
                  - relationship: customer-order
                    kind: link
                  - relationship: order-item
                    kind: link
                  - relationship: order-signal
                    kind: link
              - id: reuse-order
                tools: [invoke_action]
                parameters:
                  - { id: case-id, type: id, required: true }
                  - { id: order-id, type: id, required: true }
                effects:
                  - { relationship: case-order, kind: link }
            guidance: >-
              First call proof-orders lookup with orderId. If it returns an error, unknown order
              or missing facts, stop immediately: do not call risk, knowledge, object reads or writes,
              or complete_step. Do not try another source to work around order_not_found.
              Only after a valid order result call proof-risk lookup once; stop on its errors
              or missing facts. Use the earlier privacy citation and search proof.evidence; retrieve privacy
              again only if its earlier evidence is insufficient for this step. Read the exact order-id with search_objects. If absent, record
              exactly the returned order/customer/item/risk facts using record-order; its atomic
              create must fail on partial existing data, never overwrite. Then
              get_neighbors(order, order-id) once, omitting relationship. If order exists,
              compare all its properties with the fresh MCP facts, then get_neighbors(order,
              order-id) once. Verify customer-order, order-item and order-signal point to the
              returned ids and compare ALL returned customer/item/risk properties with MCP
              facts; this replaces separate searches for those neighbor objects. Stop on
              missing, partial or conflicting facts or links. Check case-order in that same
              result for this case. Only if this case link is absent, call reuse-order and
              verify that new case-order link once from the case. Do not reread unrelated edges
              after this link-only action. Complete with the verified order and risk facts for
              the next step.
            expectedOutput: Four persisted objects and four verified graph links from actual MCP facts.
          children:
            - id: case.order.assess
              title: Build shared eligibility evidence
              description:
                "Complete the shared assessment only when requested: use collected order/risk facts, read stock and record evidence.
                Refund and exchange are independent two-step tails; select both only for an explicit
                comparison of both completed assessments."
              ontology:
                audit: true
                deniedTools: *a1
                allowedTools:
                  - knowledge_search
                  - search_objects
                  - get_neighbors
                  - compute_function
                  - invoke_action
                  - proof-orders__*
                  - proof-risk__*
                  - proof-stock__*
                entities:
                  - *a2
                  - *a3
                  - *a4
                  - *a5
                  - *a6
                  - &a12
                    id: assessment
                    properties:
                      - id: assessment-id
                        type: id
                        primaryKey: true
                        required: true
                      - id: total
                        type: number
                        required: true
                      - id: days
                        type: number
                        required: true
                      - id: risk
                        type: number
                        required: true
                      - id: stock
                        type: number
                        required: true
                  - &a16
                    id: evidence
                    properties:
                      - id: evidence-id
                        type: id
                        primaryKey: true
                        required: true
                      - id: source
                        type: string
                        required: true
                      - id: summary
                        type: string
                        required: true
                  - &a17
                    id: policy
                    properties:
                      - id: policy-id
                        type: id
                        primaryKey: true
                        required: true
                      - id: source
                        type: string
                        required: true
                relationships:
                  - *a7
                  - *a8
                  - *a9
                  - *a10
                  - id: case-assessment
                    from: case
                    to: assessment
                    cardinality: many-to-one
                  - &a19
                    id: assessment-evidence
                    from: assessment
                    to: evidence
                    cardinality: many-to-one
                  - &a20
                    id: evidence-policy
                    from: evidence
                    to: policy
                    cardinality: many-to-one
                  - id: assessment-order
                    from: assessment
                    to: order
                    cardinality: many-to-one
                  - &assessmentSignal
                    id: assessment-signal
                    from: assessment
                    to: risk-signal
                    cardinality: many-to-one
                mcpServers:
                  - proof-orders
                  - proof-risk
                  - proof-stock
                knowledgeFoundations:
                  - proof.refund
                  - proof.exchange
                  - proof.evidence
                skills:
                  - proof-evidence
                  - proof-citations
                actions:
                  - id: record-assessment
                    tools:
                      - invoke_action
                    parameters:
                      - id: case-id
                        type: id
                        required: true
                      - id: order-id
                        type: string
                        required: true
                      - id: assessment-id
                        type: id
                        required: true
                      - id: total
                        type: number
                        required: true
                      - id: days
                        type: number
                        required: true
                      - id: risk
                        type: number
                        required: true
                      - id: stock
                        type: number
                        required: true
                      - id: evidence-id
                        type: id
                        required: true
                      - id: source
                        type: string
                        required: true
                      - id: summary
                        type: string
                        required: true
                      - id: policy-id
                        type: id
                        required: true
                      - id: signal-id
                        type: id
                        required: true
                    effects:
                      - entity: assessment
                        kind: create
                      - entity: evidence
                        kind: create
                      - entity: policy
                        kind: create
                      - relationship: case-assessment
                        kind: link
                      - relationship: assessment-evidence
                        kind: link
                      - relationship: evidence-policy
                        kind: link
                      - relationship: assessment-order
                        kind: link
                      - relationship: assessment-signal
                        kind: link
                guidance: Use this run's verified order/risk MCP facts from case.order; do not call
                  those services again. Call proof-stock lookup once. Use the earlier proof.evidence citation and search proof.refund and
                  proof.exchange together; retrieve missing evidence only when needed. Read the exact
                  assessment-id=case-id+'-assessment'. If absent, call record-assessment
                  with this run's total/days/risk/stock/signal-id, case-id, order-id, actual
                  retrieved refund source, and factual summary. Atomic creation must fail on
                  partial existing evidence/policy data, never overwrite. If present,
                  compare every numeric fact against this run's MCP results. Get all
                  assessment neighbors in one call without relationship, then all evidence
                  neighbors in one call; use returned properties to verify the evidence
                  summary/source and policy source. Verify case-assessment,
                  assessment-order, assessment-signal, assessment-evidence and evidence-policy link the
                  expected ids. Stop on missing or conflicting facts or links. Do not calculate
                  branch eligibility or net-credit here; selected branch steps own those
                  calculations. Complete this shared step once; if only shared evidence
                  was requested, stop here.
                expectedOutput: Shared facts and a linked, cited assessment; no branch decision has been recorded.
              children:
                - id: case.order.assess.refund
                  title: Prepare refund assessment
                  description:
                    Prepare a local refund review from the shared assessment. This step does not finalize it or send
                    money/goods.
                  ontology:
                    audit: true
                    deniedTools: *a1
                    allowedTools: *a11
                    entities:
                      - *a12
                      - &a15
                        id: refund-review
                        properties:
                          - id: refund-id
                            type: id
                            primaryKey: true
                            required: true
                          - id: eligible
                            type: boolean
                            required: true
                          - id: status
                            type: string
                            required: true
                    relationships:
                      - &a18
                        id: refund-assessment
                        from: refund-review
                        to: assessment
                        cardinality: many-to-one
                    functions:
                      - &a13
                        id: refund-eligible
                        entity: assessment
                        expression: $days >= 0 && $days <= 30 && $total <= 200 && $risk < 50
                        returns: boolean
                    skills:
                      - proof-refund
                      - proof-citations
                    knowledgeFoundations:
                      - proof.refund
                      - proof.evidence
                    actions:
                      - id: prepare-refund
                        tools:
                          - invoke_action
                        parameters:
                          - id: assessment-id
                            type: id
                            required: true
                          - id: refund-id
                            type: id
                            required: true
                          - id: eligible
                            type: boolean
                            required: true
                          - id: status
                            type: string
                            required: true
                        effects:
                          - entity: refund-review
                            kind: create
                          - relationship: refund-assessment
                            kind: link
                    guidance: >-
                      Use the verified assessment from this run's shared step. Reuse its
                      proof.refund and proof.evidence citations; search only if required evidence is
                      missing or insufficient. Compute refund-eligible once; do not compute the
                      other branch or net-credit. Read exact refund-id=case-id+'-refund'. If absent
                      call prepare-refund with that id, assessment-id=case-id+'-assessment',
                      computed eligible and status='prepared'. If present verify eligible matches
                      and status is prepared or verified, then get all review neighbors once; verify
                      refund-assessment targets the expected assessment and its returned facts still
                      match the shared step. Stop on mismatch; preserve existing status. Complete
                      this step; finalize only when selected. Report the stored status.
                    expectedOutput: A prepared or previously verified refund review with matching eligibility and linked assessment.
                  children:
                    - id: case.order.assess.refund.finalize
                      title: Finalize refund assessment
                      description:
                        Finalize and verify the local refund review. Requires prepare-refund. No real refund,
                        reservation, shipment, or customer message.
                      ontology:
                        audit: true
                        deniedTools: *a1
                        allowedTools:
                          - knowledge_search
                          - search_objects
                          - get_neighbors
                          - compute_function
                          - invoke_action
                          - proof-risk__*
                        entities:
                          - *a12
                          - *a15
                          - *a16
                          - *a17
                          - *a6
                        relationships:
                          - *a18
                          - *a19
                          - *a20
                          - *assessmentSignal
                        functions:
                          - *a13
                          - &a14
                            id: net-credit
                            entity: assessment
                            expression: $total * 0.9
                            returns: number
                        skills:
                          - proof-refund
                          - proof-citations
                        knowledgeFoundations:
                          - proof.refund
                          - proof.evidence
                        mcpServers:
                          - proof-risk
                        actions:
                          - id: finalize-refund
                            tools:
                              - invoke_action
                            parameters:
                              - id: refund-id
                                type: id
                                required: true
                              - id: status
                                type: string
                                required: true
                            effects:
                              - entity: refund-review
                                kind: update
                        guidance: >-
                          Reuse this run's proof.refund and proof.evidence citations; search only if
                          required evidence is missing or insufficient. Recheck proof-risk lookup once
                          for the supplied order-id. Get all neighbors of the expected assessment once,
                          then all neighbors of its expected evidence once, omitting relationship. These
                          results contain the review, assessment and policy properties: do not
                          separately search the review or read its neighbors. Verify the inbound
                          refund-assessment edge comes from exact review id case-id+'-refund',
                          assessment-evidence and evidence-policy target the expected ids, and the
                          actual evidence source matches the retrieved citation. Verify the review
                          status is prepared or verified. Also verify assessment-signal points to the
                          fresh signal-id and its returned risk matches both the fresh risk MCP result
                          and stored assessment. Compare the current assessment properties returned by
                          the evidence neighbor with this run's shared snapshot; stop on missing links
                          or changed facts. Recompute refund-eligible and calculate net-credit once
                          each. Verify stored review eligibility equals the fresh calculation. If the
                          review is prepared call finalize-refund with status='verified'; if already
                          verified preserve it without another write. The successful update result or
                          freshly read verified status confirms the review state. Return the skill's
                          exact marker, eligibility, source and review id; call complete_step.
                        expectedOutput: Verified local refund assessment using the proof-refund output format.
                - id: case.order.assess.exchange
                  title: Prepare exchange assessment
                  description:
                    Prepare a local exchange review from the shared assessment. This step does not finalize it or
                    send money/goods.
                  ontology:
                    audit: true
                    deniedTools: *a1
                    allowedTools: *a11
                    entities:
                      - *a12
                      - &a22
                        id: exchange-review
                        properties:
                          - id: exchange-id
                            type: id
                            primaryKey: true
                            required: true
                          - id: eligible
                            type: boolean
                            required: true
                          - id: status
                            type: string
                            required: true
                    relationships:
                      - &a23
                        id: exchange-assessment
                        from: exchange-review
                        to: assessment
                        cardinality: many-to-one
                    functions:
                      - &a21
                        id: exchange-eligible
                        entity: assessment
                        expression: $days >= 0 && $days <= 30 && $stock >= 1 && $risk < 50
                        returns: boolean
                    skills:
                      - proof-exchange
                      - proof-citations
                    knowledgeFoundations:
                      - proof.exchange
                      - proof.evidence
                    actions:
                      - id: prepare-exchange
                        tools:
                          - invoke_action
                        parameters:
                          - id: assessment-id
                            type: id
                            required: true
                          - id: exchange-id
                            type: id
                            required: true
                          - id: eligible
                            type: boolean
                            required: true
                          - id: status
                            type: string
                            required: true
                        effects:
                          - entity: exchange-review
                            kind: create
                          - relationship: exchange-assessment
                            kind: link
                    guidance: >-
                      Use the verified assessment from this run's shared step. Reuse its
                      proof.exchange and proof.evidence citations; search only if required evidence
                      is missing or insufficient. Compute exchange-eligible once; do not compute the
                      other branch or net-credit. Read exact exchange-id=case-id+'-exchange'. If
                      absent call prepare-exchange with that id,
                      assessment-id=case-id+'-assessment', computed eligible and status='prepared'.
                      If present verify eligible matches and status is prepared or verified, then
                      get all review neighbors once; verify exchange-assessment targets the expected
                      assessment and its returned facts still match the shared step. Stop on
                      mismatch; preserve existing status. Complete this step; finalize only when
                      selected. Report the stored status.
                    expectedOutput: A prepared or previously verified exchange review with matching eligibility and linked assessment.
                  children:
                    - id: case.order.assess.exchange.finalize
                      title: Finalize exchange assessment
                      description:
                        Finalize and verify the local exchange review. Requires prepare-exchange. No real refund,
                        reservation, shipment, or customer message.
                      ontology:
                        audit: true
                        deniedTools: *a1
                        allowedTools:
                          - knowledge_search
                          - search_objects
                          - get_neighbors
                          - compute_function
                          - invoke_action
                          - proof-stock__*
                        entities:
                          - *a12
                          - *a22
                          - *a16
                          - *a17
                        relationships:
                          - *a23
                          - *a19
                          - *a20
                        functions:
                          - *a21
                          - *a14
                        skills:
                          - proof-exchange
                          - proof-citations
                        # The shared evidence stores a refund-policy citation; finalization
                        # must explicitly allow that source to verify its provenance.
                        knowledgeFoundations:
                          - proof.exchange
                          - proof.evidence
                          - proof.refund
                        mcpServers:
                          - proof-stock
                        actions:
                          - id: finalize-exchange
                            tools:
                              - invoke_action
                            parameters:
                              - id: exchange-id
                                type: id
                                required: true
                              - id: status
                                type: string
                                required: true
                            effects:
                              - entity: exchange-review
                                kind: update
                        guidance: >-
                          Reuse this run's proof.exchange, proof.evidence and proof.refund citations; search only if
                          required evidence is missing or insufficient. Recheck proof-stock lookup once
                          for the supplied order-id. Get all neighbors of the expected assessment once,
                          then all neighbors of its expected evidence once, omitting relationship. These
                          results contain the review, assessment and policy properties: do not
                          separately search the review or read its neighbors. Verify the inbound
                          exchange-assessment edge comes from exact review id case-id+'-exchange',
                          assessment-evidence and evidence-policy target the expected ids, and the
                          actual evidence source matches the retrieved citation. Verify the review
                          status is prepared or verified. Verify fresh stock equals the stored
                          assessment stock. Compare the current assessment properties returned by the
                          evidence neighbor with this run's shared snapshot; stop on missing links or
                          changed facts. Recompute exchange-eligible and calculate net-credit once each.
                          Verify stored review eligibility equals the fresh calculation. If the review
                          is prepared call finalize-exchange with status='verified'; if already verified
                          preserve it without another write. The successful update result or freshly
                          read verified status confirms the review state. Return the skill's exact
                          marker, eligibility, source and review id; call complete_step.
                        expectedOutput: Verified local exchange assessment using the proof-exchange output format.
knowledgeFoundations:
  - id: proof.intake
    descriptor:
      kind: local
      displayName: Fictional intake policy
    snippets:
      - foundationId: proof.intake
        source: intake/evidence.md
        title: intake eligibility evidence
        text:
          "Intake evidence: require supplied order id and case id. Create the case only if absent, including when
          both tails are requested. On replay verify its order id and reread evidence; stop if facts conflict."
  - id: proof.privacy
    descriptor:
      kind: local
      displayName: Fictional privacy policy
    snippets:
      - foundationId: proof.privacy
        source: privacy/evidence.md
        title: privacy eligibility evidence
        text: "Privacy evidence: fictional data only. Never send messages, payments, reservations or shipments."
  - id: proof.evidence
    descriptor:
      kind: local
      displayName: Fictional evidence policy
    snippets:
      - foundationId: proof.evidence
        source: evidence/lineage.md
        title: evidence eligibility evidence
        text:
          "Eligibility evidence: store exact MCP facts and retrieved source; traverse case → assessment → evidence
          → policy, plus assessment → order → signal. Never invent facts."
  - id: proof.refund
    descriptor:
      kind: local
      displayName: Fictional refund policy
    snippets:
      - foundationId: proof.refund
        source: refund/eligibility.md
        title: refund eligibility evidence
        text:
          "Refund eligibility evidence: days from 0 through 30, total <= 200 and risk < 50. Net credit estimate is
          total * 0.9. A local assessment does not execute a payment."
  - id: proof.exchange
    descriptor:
      kind: local
      displayName: Fictional exchange policy
    snippets:
      - foundationId: proof.exchange
        source: exchange/eligibility.md
        title: exchange eligibility evidence
        text:
          "Exchange eligibility evidence: days from 0 through 30, stock >= 1 and risk < 50. A local assessment
          does not reserve stock or ship anything."
requiredTools:
  - knowledge_search
  - search_objects
  - get_neighbors
  - compute_function
  - invoke_action
  - proof-orders__*
  - proof-risk__*
  - proof-stock__*
requiredSkills:
  - proof-evidence
  - proof-citations
  - proof-refund
  - proof-exchange
requiredMcpServers:
  - proof-orders
  - proof-risk
  - proof-stock
governanceMode: enforce
