# ClawWorks example BUNDLE: the one work-map that carries BOTH retrieval families.
#
#   pnpm openclaw enterprise bundle import examples/enterprise/orders-handbook.clawworks-bundle.yaml
#   pnpm openclaw gateway restart
#
# WHY THIS EXISTS
# ---------------
# Every other shipped example gives the model exactly one way to look something
# up, so it never has to CHOOSE:
#
#   golden.orders            8 seeded objects, no knowledge  (a tree cannot carry any)
#   acme.support-desk        an inlined handbook, zero seeded objects
#   acme.financial-operations / acme.incident-response
#                            seeded objects AND foundation ids — but they are TREES,
#                            so the foundations are never inlined and retrieval
#                            returns nothing
#
# So "does the layer pick the right tool" was untestable. This bundle seeds a
# small order graph AND inlines the policy handbook that governs it, and one step
# holds both, which is the only place the choice is real.
#
# THE RULE IT EXISTS TO PROVE
# ---------------------------
# The object store wins for facts about a named record. It returns the stored
# value under a primary key — exact, checkable, and the same on every run.
# Retrieval returns prose that merely MENTIONS values, so answering "what is this
# order's total" from the handbook produces a policy number ($200) dressed as a
# record fact (310). The digest states this once, and only when a run holds both
# (buildEnterprisePromptSection).
#
# Ids are deliberately unlike golden.orders' (SO-/CU-/RF- against ORD-/CUST-/REF-)
# so a reply can never be graded against the wrong fixture.
schema: clawworks.workflow-bundle
schemaVersion: 1
trees:
  - schema: clawworks.workflow-tree
    schemaVersion: 1
    id: acme.orders-handbook
    version: 1.0.0
    name: Order desk with handbook
    description: >-
      Store-order records AND the refund policy handbook that governs them, in
      one work-map: look up a named SO- order, customer, or refund, quote the
      written policy, and decide a case against both. Use this when a request
      needs the shop's own records and its written rules together — the record
      says what happened, the handbook says what may be done about it.
    match:
      # Higher than the other examples: this bundle is the one an operator imports
      # to exercise tool SELECTION, and it must win its own cases rather than lose
      # them to a neighbouring work-map that covers only half the ground.
      triggers: [user]
      priority: 40
    root:
      id: shop
      title: Order desk
      description: Settle an order case from the shop's records and its handbook.
      ontology:
        # Shell stays out of every step: this desk reads records, not machines.
        deniedTools: [exec, process, browser]
        # A root allow-list, and it must be a SUPERSET of every child scope, because
        # allowedTools is an independent gate at each node on the root→active path.
        # The MCP globs belong here for a second reason: whether the server is handed
        # to the harness AT ALL is decided run-wide before any step is active, so a
        # sibling step that narrows without them withholds the server for the whole
        # run. Attaching it on shop.escalate is what then limits WHICH step may call
        # it; this list only makes it reachable at launch.
        allowedTools:
          [
            message,
            search_objects,
            get_neighbors,
            compute_function,
            knowledge_search,
            invoke_action,
            "acme-tracker__*",
            "mcp__acme-tracker__*",
            "acme_tracker__*",
            "mcp__acme_tracker__*",
          ]
        entities:
          - id: customer
            title: Customer
            properties:
              - { id: customer-id, type: id, primaryKey: true }
              - { id: name, type: string, required: true }
              - { id: tier, type: string }
          - id: order
            title: Order
            properties:
              - { id: order-id, type: id, primaryKey: true }
              - { id: customer-id, type: id, required: true }
              - { id: total, type: number, required: true }
              - { id: status, type: string, required: true }
              - { id: days-since-delivery, type: number }
          - id: refund
            title: Refund
            properties:
              - { id: refund-id, type: id, primaryKey: true }
              - { id: order-id, type: id, required: true }
              - { id: amount, type: number, required: true }
        relationships:
          - id: placed
            from: customer
            to: order
            cardinality: one-to-many
            description: The customer who placed the order.
          - id: settles
            from: refund
            to: order
            cardinality: one-to-one
            description: The order a refund settles.
        functions:
          # Deliberately NOT the handbook's number. The handbook says $200; this
          # derived value caps at 150, so a reply that quotes 200 for a specific
          # order has answered a record question from a policy passage — exactly
          # the confusion this fixture is built to catch.
          - id: auto-refundable-amount
            entity: order
            returns: number
            expression: min($total, 150)
            description: What this order refunds without human approval.
        objects:
          - entity: customer
            properties: { customer-id: CU-01, name: Mina Park, tier: standard }
          - entity: customer
            properties: { customer-id: CU-02, name: Tomas Neves, tier: priority }
          - entity: order
            properties:
              { order-id: SO-3001, customer-id: CU-01, total: 96, status: delivered, days-since-delivery: 12 }
          - entity: order
            properties:
              { order-id: SO-3002, customer-id: CU-01, total: 420, status: delivered, days-since-delivery: 45 }
          - entity: order
            properties:
              { order-id: SO-3003, customer-id: CU-02, total: 210, status: in-transit, days-since-delivery: 0 }
          - entity: refund
            properties: { refund-id: RF-7001, order-id: SO-3001, amount: 96 }
        links:
          - { relationship: placed, from: CU-01, to: SO-3001 }
          - { relationship: placed, from: CU-01, to: SO-3002 }
          - { relationship: placed, from: CU-02, to: SO-3003 }
          - { relationship: settles, from: RF-7001, to: SO-3001 }
        knowledgeFoundations: [acme.orders-handbook]
        contextHints:
          - Name the order id you acted on, and the handbook section you relied on.
        audit: true
      children:
        - id: shop.lookup
          title: Look up the record
          description: Read a named order, customer, or refund from the shop's records.
          ontology:
            # Records only. No knowledge_search here on purpose: a step that can
            # retrieve will sometimes retrieve instead of reading, and this step
            # exists to prove the store answers record questions on its own.
            allowedTools: [search_objects, get_neighbors, compute_function]
            expectedOutput: The record's stored fields, named by primary key.

        - id: shop.policy
          title: Quote the policy
          description: Answer what the handbook says about refunds, timing, and escalation.
          ontology:
            # The mirror of the step above: written rules only, no record access.
            allowedTools: [knowledge_search]
            knowledgeFoundations: [acme.orders-handbook]
            # Bundled with OpenClaw and needs no binary, so this resolves on a
            # stock install rather than being a dangling id.
            skills: [summarize]
            expectedOutput: The rule, with the handbook section it came from.

        - id: shop.decide
          title: Decide the case
          description: >-
            Judge one named order against the written policy and refund it or
            escalate. The record supplies the facts; the handbook supplies the rule.
          ontology:
            # The step that holds BOTH. Everything this fixture is for happens
            # here: the model must read the order's own total and derived cap from
            # the store, then judge them against the handbook's threshold — and
            # must not swap the two sources.
            allowedTools:
              [search_objects, get_neighbors, compute_function, knowledge_search, invoke_action, message]
            knowledgeFoundations: [acme.orders-handbook]
            actions:
              - id: issue-refund
                title: Issue a refund
                description: Record a repayment against an order.
                parameters:
                  # The primary key of the type the create effect writes; without
                  # it no call can name the new refund and validation fails.
                  - { id: refund-id, type: id, required: true }
                  - { id: order-id, type: id, required: true }
                  - { id: amount, type: number, required: true }
                effects:
                  - { entity: refund, kind: create, description: Records the repayment. }
            constraints:
              - id: record-over-policy
                description: Take amounts and dates from the order record, never from a handbook passage.
            expectedOutput: The refund id, or the reason it was escalated.
            audit: true

        - id: shop.escalate
          title: Hand off to a human
          description: Summarize for a human when the desk may not decide it.
          ontology:
            # Reads, even though escalation only summarizes. The planner can cut
            # STRAIGHT here, and a message-only version entered that way had no
            # prior turn to summarize: it produced "per the applicable handbook
            # rule" without naming one, because it could not see the order's
            # status or the rule that forced the handoff. A step cannot promise
            # an expectedOutput its scope withholds the facts for.
            # No invoke_action: handing off is not a write.
            # The MCP globs sit beside the plain tools because a native harness
            # (Codex, the Claude CLI) reports a tool call with no origin, so a step
            # that narrows its tools has to name the server's tools too — every
            # spelling, since the harness picks which one it exposes (OpenClaw maps
            # punctuation to `-`, Codex to `_`, either may carry an `mcp__` prefix).
            allowedTools:
              [
                message,
                search_objects,
                knowledge_search,
                "acme-tracker__*",
                "mcp__acme-tracker__*",
                "acme_tracker__*",
                "mcp__acme_tracker__*",
              ]
            # The ONLY step that may reach the tracker. Attaching it here also turns
            # MCP governance on for the whole work-map (plan.ts: a tree that never
            # mentions MCP does not govern it), which is what makes the tracker
            # denied on lookup, policy, and decide rather than quietly callable from
            # every step. Register a server named `acme-tracker` under mcp.servers
            # to resolve it; until then the MCP tab shows it unregistered.
            mcpServers: [acme-tracker]
            knowledgeFoundations: [acme.orders-handbook]
            skills: [summarize]
            expectedOutput: A handoff note naming the order and the rule that forced it.

knowledgeFoundations:
  - id: acme.orders-handbook
    descriptor:
      kind: local
      displayName: Order desk handbook (example)
      detail: inlined in orders-handbook.clawworks-bundle.yaml
      description: Refund thresholds, delivery windows, and escalation rules for the order desk example.
    snippets:
      - foundationId: acme.orders-handbook
        title: Refund limits
        source: handbook/refunds.md
        text: >-
          A refund of $200 or less may be issued without approval when the order
          was delivered within the last 30 days. Past 30 days, offer store credit
          instead of a refund. Any refund above $200 goes to a human approver
          regardless of the delivery date.
      - foundationId: acme.orders-handbook
        title: Escalation path
        source: handbook/escalation.md
        text: >-
          Escalate when the customer asks for a human, when the amount exceeds the
          approval threshold, or when the order has not been delivered yet. An
          undelivered order is never refunded from this desk; it is a delivery
          case until it arrives.
      - foundationId: acme.orders-handbook
        title: Priority customers
        source: handbook/tiers.md
        text: >-
          A priority customer's case is acknowledged the same business day. Tier
          never changes a refund threshold; it changes only how quickly the desk
          responds.
      - foundationId: acme.orders-handbook
        title: Wording
        source: handbook/replies.md
        text: >-
          Name what went wrong in the customer's own words, say what you did, then
          say what happens next and when. Apologize at most once.
# Derived from the tree above; import recomputes all three, so this is a manifest
# for the reader rather than a contract.
requiredTools:
  [
    compute_function,
    get_neighbors,
    invoke_action,
    knowledge_search,
    message,
    search_objects,
  ]
requiredSkills: [summarize]
