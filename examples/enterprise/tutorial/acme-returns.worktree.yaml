# Finished tutorial work-map. Import it with:
# openclaw enterprise trees import examples/enterprise/tutorial/acme-returns.worktree.yaml
# openclaw gateway restart
# Register acme-tracker and acme.returns-kb before using their bindings.
# Assessment chain: returns -> triage -> lookup -> decide; each predecessor must complete.
# Delivery-only requests use returns -> delivery and never enter the assessment chain.
# Permissions are local. Denials are repeated because they apply to every step.
# This example uses permissive grants and the embedded per-call MCP runtime.
schema: clawworks.workflow-tree
schemaVersion: 1
id: acme.returns
version: 1.1.0
name: Returns desk

# The routing signal, and the only thing that decides whether a request enters
# this work-map at all. Domain nouns first, tasks second, under 600 characters:
# a description that covered "refund an order" but not "the orders" loses
# "where is my order" to the permissive default tree.
description: >-
  Acme customer orders, returns, refunds, replacements and parcel delivery: order records and totals, delivery
  dates, carrier tracking and shipment scans, the returns policy handbook (30-day window, restocking fees,
  refund thresholds), shipping service levels, and the support escalation matrix. Handles "can I return this",
  "where is my order", refund eligibility, late or lost parcels, damaged items, and who a case escalates to.

match:
  triggers: [user]
  priority: 10

root:
  id: returns
  title: Confirm the returns request
  description: Check the request and prerequisites for returns desk.
  ontology:
    deniedTools: &deniedTools_1 [exec, write, edit]
    # Advisory, and typed straight into the Control UI's "Role prompt" box. It
    # teaches; it never widens. Enforcement wins on conflict.
    guidance: >-
      Confirm the requested operation, supplied record ids, and explicit exclusions. Ask for missing context;
      do not perform a downstream action. Complete this step before entering the selected next step.
    expectedOutput: Confirmed scope, known inputs, and any unresolved prerequisite.
    allowedTools: &allowedTools_3 [message]
  children:
    - id: returns.triage
      title: Read the policy
      description: Find the handbook rule that applies to this request.
      ontology:
        # The first entry turns this into an allowlist: on this step, anything
        # else raises a one-off approval instead of running.
        allowedTools: [knowledge_search]
        knowledgeFoundations: [acme.returns-kb]
        # Trace every tool decision under this step, including default allows.
        audit: true
        deniedTools: *deniedTools_1
      children:
        - id: returns.lookup
          title: Look up the order
          description: After reading the policy, fetch order and shipment facts for a return assessment.
          ontology:
            mcpServers: [acme-tracker]
            audit: true
            deniedTools: *deniedTools_1
          children:
            - id: returns.decide
              title: Decide and reply
              description: After policy and order lookup complete, assess return eligibility and write the answer.
              ontology:
                allowedTools: *allowedTools_3
                # Advisory: selected-route skills are loaded for the run. Apply this
                # reply style here; the skill does not grant tools.
                skills: [refund-reply]
                expectedOutput: The decision, the rule it rests on, and the order id.
                deniedTools: *deniedTools_1
    - id: returns.delivery
      title: Check delivery only
      description: Read order and shipment status without a policy lookup or return decision.
      ontology:
        mcpServers: [acme-tracker]
        audit: true
        deniedTools: *deniedTools_1
        guidance: >-
          Fetch only the requested order and shipment facts. Report a missing order honestly.
          Do not assess return eligibility, retrieve policy, or claim a refund.
        expectedOutput: Actual order status, shipment facts, or the tracker's not-found result.
